[project]
name = "tp-cyber"
version = "1.0.0"
description = "Professional TCP port scanner for security assessments"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
]

[project.scripts]
port-scanner = "scanner.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
]

[build-system]
requires = [
    "setuptools>=65",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: local integration tests using loopback sockets"
]

addopts = [
    "-v",
    "--tb=short"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
