[project]
name = "tp-cyber"
version = "1.0.0"
description = "Professional TCP port scanner for security assessments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer[all]>=0.25.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.13",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]